pipeline:
  name: ECS Blue Green Example
  identifier: ECS_blue_green_Example
  description: Composition example; deployment inputs must be bound before execution.
  template:
    templateRef: ecs_blue_green_delivery
    versionLabel: 0.1.0
    templateInputs:
      stages:
      - stage:
          identifier: Dev
          template:
            templateInputs:
              type: Deployment
              spec:
                service:
                  serviceRef: <+input>
                  serviceInputs: <+input>
                environment:
                  environmentRef: <+input>
                  environmentInputs: <+input>
                  serviceOverrideInputs: <+input>
                  infrastructureDefinitions: <+input>
                execution:
                  steps:
                  - step:
                      identifier: BlueGreen_Create
                      type: EcsBlueGreenCreateService
                      spec:
                        loadBalancer: <+input>
                        prodListener: <+input>
                        prodListenerRuleArn: <+input>
                        stageListener: <+input>
                        stageListenerRuleArn: <+input>
      - stage:
          identifier: Staging
          template:
            templateInputs:
              type: Deployment
              spec:
                environment:
                  environmentRef: <+input>
                  environmentInputs: <+input>
                  serviceOverrideInputs: <+input>
                  infrastructureDefinitions: <+input>
                execution:
                  steps:
                  - step:
                      identifier: BlueGreen_Create
                      type: EcsBlueGreenCreateService
                      spec:
                        loadBalancer: <+input>
                        prodListener: <+input>
                        prodListenerRuleArn: <+input>
                        stageListener: <+input>
                        stageListenerRuleArn: <+input>
      - stage:
          identifier: Prod
          template:
            templateInputs:
              type: Deployment
              spec:
                environment:
                  environmentRef: <+input>
                  environmentInputs: <+input>
                  serviceOverrideInputs: <+input>
                  infrastructureDefinitions: <+input>
                execution:
                  steps:
                  - step:
                      identifier: BlueGreen_Create
                      type: EcsBlueGreenCreateService
                      spec:
                        loadBalancer: <+input>
                        prodListener: <+input>
                        prodListenerRuleArn: <+input>
                        stageListener: <+input>
                        stageListenerRuleArn: <+input>

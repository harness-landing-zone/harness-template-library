pipeline:
  name: ECS Canary Example
  identifier: ECS_canary_Example
  description: Composition example; deployment inputs must be bound before execution.
  template:
    templateRef: ecs_canary_delivery
    versionLabel: 0.1.0
    templateInputs:
      stages:
      - stage:
          identifier: Dev
          template:
            templateInputs:
              type: Deployment
              spec:
                service:
                  serviceRef: <+input>
                  serviceInputs: <+input>
                environment:
                  environmentRef: <+input>
                  environmentInputs: <+input>
                  serviceOverrideInputs: <+input>
                  infrastructureDefinitions: <+input>
      - stage:
          identifier: Staging
          template:
            templateInputs:
              type: Deployment
              spec:
                environment:
                  environmentRef: <+input>
                  environmentInputs: <+input>
                  serviceOverrideInputs: <+input>
                  infrastructureDefinitions: <+input>
      - stage:
          identifier: Prod
          template:
            templateInputs:
              type: Deployment
              spec:
                environment:
                  environmentRef: <+input>
                  environmentInputs: <+input>
                  serviceOverrideInputs: <+input>
                  infrastructureDefinitions: <+input>

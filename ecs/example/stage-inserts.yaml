pipeline:
  name: ECS Stage Inserts Example
  identifier: ECS_Stage_Inserts_Example
  orgIdentifier: template_factory
  projectIdentifier: Experian_Demo_Templates
  description: BG in each slot; select the same immutable service/artifact release separately per slot. Developer tests are
    empty.
  template:
    templateRef: ecs_stage_insert_delivery
    versionLabel: 0.1.0
    templateInputs:
      stages:
      - insert:
          identifier: Dev
          stages:
          - stage:
              name: Dev Blue Green
              identifier: Dev_BG
              template:
                templateRef: ecs_blue_green_stage
                versionLabel: 0.1.0
                templateInputs:
                  type: Deployment
                  spec:
                    service:
                      serviceRef: <+input>
                      serviceInputs: <+input>
                    environment:
                      environmentRef: <+input>
                      environmentInputs: <+input>
                      serviceOverrideInputs: <+input>
                      infrastructureDefinitions: <+input>
                    execution:
                      steps:
                      - insert:
                          identifier: Application_Validation
                          steps: []
                      - insert:
                          identifier: Live_Validation
                          steps: []
      - insert:
          identifier: Staging
          stages:
          - stage:
              name: Staging Blue Green
              identifier: Staging_BG
              template:
                templateRef: ecs_blue_green_stage
                versionLabel: 0.1.0
                templateInputs:
                  type: Deployment
                  spec:
                    service:
                      serviceRef: <+input>
                      serviceInputs: <+input>
                    environment:
                      environmentRef: <+input>
                      environmentInputs: <+input>
                      serviceOverrideInputs: <+input>
                      infrastructureDefinitions: <+input>
                    execution:
                      steps:
                      - insert:
                          identifier: Application_Validation
                          steps: []
                      - insert:
                          identifier: Live_Validation
                          steps: []
      - insert:
          identifier: Prod
          stages:
          - stage:
              name: Prod Blue Green
              identifier: Prod_BG
              template:
                templateRef: ecs_blue_green_stage
                versionLabel: 0.1.0
                templateInputs:
                  type: Deployment
                  spec:
                    service:
                      serviceRef: <+input>
                      serviceInputs: <+input>
                    environment:
                      environmentRef: <+input>
                      environmentInputs: <+input>
                      serviceOverrideInputs: <+input>
                      infrastructureDefinitions: <+input>
                    execution:
                      steps:
                      - insert:
                          identifier: Application_Validation
                          steps: []
                      - insert:
                          identifier: Live_Validation
                          steps: []

pipeline:
  name: ECS Inserts Example
  identifier: ECS_Stage_Inserts_Example
  template:
    templateRef: ecs_stage_insert_delivery
    versionLabel: 0.1.0
    templateInputs:
      stages:
      - insert:
          identifier: Dev
          stages:
          - stage:
              name: Dev Rolling
              identifier: Dev_Rolling
              template:
                templateRef: ecs_rolling_stage
                versionLabel: 0.1.0
                templateInputs:
                  type: Deployment
                  spec:
                    service:
                      serviceRef: <+input>
                      serviceInputs: <+input>
                    environment:
                      environmentRef: <+input>
                      environmentInputs: <+input>
                      serviceOverrideInputs: <+input>
                      infrastructureDefinitions: <+input>
      - insert:
          identifier: Staging
          stages:
          - stage:
              name: Staging Canary
              identifier: Staging_Canary
              template:
                templateRef: ecs_canary_stage
                versionLabel: 0.1.0
                templateInputs:
                  type: Deployment
                  spec:
                    service:
                      serviceRef: <+input>
                      serviceInputs: <+input>
                    environment:
                      environmentRef: <+input>
                      environmentInputs: <+input>
                      serviceOverrideInputs: <+input>
                      infrastructureDefinitions: <+input>
      - insert:
          identifier: Prod
          stages:
          - stage:
              name: Prod Blue Green
              identifier: Prod_BG
              template:
                templateRef: ecs_blue_green_stage
                versionLabel: 0.1.0
                templateInputs:
                  type: Deployment
                  spec:
                    service:
                      serviceRef: <+input>
                      serviceInputs: <+input>
                    environment:
                      environmentRef: <+input>
                      environmentInputs: <+input>
                      serviceOverrideInputs: <+input>
                      infrastructureDefinitions: <+input>
                    execution:
                      steps:
                      - step:
                          identifier: BlueGreen_Create
                          type: EcsBlueGreenCreateService
                          spec:
                            loadBalancer: <+input>
                            prodListener: <+input>
                            prodListenerRuleArn: <+input>
                            stageListener: <+input>
                            stageListenerRuleArn: <+input>

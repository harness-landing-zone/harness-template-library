pipeline:
  name: ECS variables example
  identifier: ECS_variables_Example
  orgIdentifier: template_factory
  projectIdentifier: Experian_Demo_Templates
  description: Candidate consumer. Select service/artifact and targets. Functional test inserts are intentionally empty.
  template:
    templateRef: ecs_variable_delivery
    versionLabel: 0.1.0
    templateInputs:
      variables:
      - name: devDeploymentStrategy
        type: String
        value: rolling
      - name: stagingDeploymentStrategy
        type: String
        value: rolling
      - name: prodDeploymentStrategy
        type: String
        value: rolling
      stages:
      - stage:
          identifier: Dev
          template:
            templateInputs:
              type: Deployment
              spec:
                service:
                  serviceRef: <+input>
                  serviceInputs: <+input>
                environment:
                  environmentRef: <+input>
                  environmentInputs: <+input>
                  serviceOverrideInputs: <+input>
                  infrastructureDefinitions: <+input>
                execution:
                  steps:
                  - insert:
                      identifier: Application_Validation
                      steps: []
                  - insert:
                      identifier: Live_Validation
                      steps: []
      - stage:
          identifier: Staging
          template:
            templateInputs:
              type: Deployment
              spec:
                environment:
                  environmentRef: <+input>
                  environmentInputs: <+input>
                  serviceOverrideInputs: <+input>
                  infrastructureDefinitions: <+input>
                execution:
                  steps:
                  - insert:
                      identifier: Application_Validation
                      steps: []
                  - insert:
                      identifier: Live_Validation
                      steps: []
      - stage:
          identifier: Prod
          template:
            templateInputs:
              type: Deployment
              spec:
                environment:
                  environmentRef: <+input>
                  environmentInputs: <+input>
                  serviceOverrideInputs: <+input>
                  infrastructureDefinitions: <+input>
                execution:
                  steps:
                  - insert:
                      identifier: Application_Validation
                      steps: []
                  - insert:
                      identifier: Live_Validation
                      steps: []

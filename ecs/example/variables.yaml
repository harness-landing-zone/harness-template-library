pipeline:
  name: ECS Variables Example
  identifier: ECS_variables_Example
  template:
    templateRef: ecs_variable_delivery
    versionLabel: 0.1.0
    templateInputs:
      variables:
      - name: devDeploymentStrategy
        type: String
        value: rolling
      - name: stagingDeploymentStrategy
        type: String
        value: canary
      - name: prodDeploymentStrategy
        type: String
        value: blue-green
      stages:
      - stage:
          identifier: Dev
          template:
            templateInputs:
              type: Deployment
              spec:
                service:
                  serviceRef: <+input>
                  serviceInputs: <+input>
                environment:
                  environmentRef: <+input>
                  environmentInputs: <+input>
                  serviceOverrideInputs: <+input>
                  infrastructureDefinitions: <+input>
                execution:
                  steps:
                  - step:
                      identifier: BlueGreen_Create
                      type: EcsBlueGreenCreateService
                      spec:
                        loadBalancer: <+input>
                        prodListener: <+input>
                        prodListenerRuleArn: <+input>
                        stageListener: <+input>
                        stageListenerRuleArn: <+input>
      - stage:
          identifier: Staging
          template:
            templateInputs:
              type: Deployment
              spec:
                environment:
                  environmentRef: <+input>
                  environmentInputs: <+input>
                  serviceOverrideInputs: <+input>
                  infrastructureDefinitions: <+input>
                execution:
                  steps:
                  - step:
                      identifier: BlueGreen_Create
                      type: EcsBlueGreenCreateService
                      spec:
                        loadBalancer: <+input>
                        prodListener: <+input>
                        prodListenerRuleArn: <+input>
                        stageListener: <+input>
                        stageListenerRuleArn: <+input>
      - stage:
          identifier: Prod
          template:
            templateInputs:
              type: Deployment
              spec:
                environment:
                  environmentRef: <+input>
                  environmentInputs: <+input>
                  serviceOverrideInputs: <+input>
                  infrastructureDefinitions: <+input>
                execution:
                  steps:
                  - step:
                      identifier: BlueGreen_Create
                      type: EcsBlueGreenCreateService
                      spec:
                        loadBalancer: <+input>
                        prodListener: <+input>
                        prodListenerRuleArn: <+input>
                        stageListener: <+input>
                        stageListenerRuleArn: <+input>

# Service-specific environment override (Overrides V2) supplying the Blue/Green routing
# that ecs_blue_green_stage and ecs_variable_strategy_stage read as <+serviceVariables.*>.
# Owned by whoever owns the load balancer, ideally written by infrastructure automation.
# Add one file per environment that runs Blue/Green.
overrides:
  identifier: prod_my_ecs_service
  orgIdentifier: ORG_ID
  projectIdentifier: PROJECT_ID
  environmentRef: prod
  serviceRef: my_ecs_service
  type: ENV_SERVICE_OVERRIDE
  spec:
    variables:
    - name: loadBalancer
      type: String
      value: <PROD_LOAD_BALANCER_ARN>
    - name: prodListenerArn
      type: String
      value: <PROD_LIVE_LISTENER_ARN>
    - name: prodListenerRuleArn
      type: String
      value: <PROD_LIVE_LISTENER_RULE_ARN>
    - name: stageListenerArn
      type: String
      value: <PROD_CANDIDATE_LISTENER_ARN>
    - name: stageListenerRuleArn
      type: String
      value: <PROD_CANDIDATE_LISTENER_RULE_ARN>

# Environment bindings owned by the application team. The artifact tag stays a runtime input
# (supplied by a trigger or at run time). Replace the example identifiers with your own.
inputSet:
  name: Environments
  identifier: environments
  orgIdentifier: ORG_ID
  projectIdentifier: PROJECT_ID
  pipeline:
    identifier: ecs_blue_green
    template:
      templateInputs:
        stages:
        - stage:
            identifier: Dev
            template:
              templateInputs:
                type: Deployment
                spec:
                  service:
                    serviceRef: my_ecs_service
                  environment:
                    environmentRef: dev
                    infrastructureDefinitions:
                    - identifier: dev_ecs
                  execution:
                    steps:
                    - step:
                        identifier: BlueGreen_Create
                        type: EcsBlueGreenCreateService
                        spec:
                          loadBalancer: <DEV_LOAD_BALANCER_ARN>
                          prodListener: <DEV_PROD_LISTENER_ARN>
                          prodListenerRuleArn: <DEV_PROD_LISTENER_RULE_ARN>
                          stageListener: <DEV_STAGE_LISTENER_ARN>
                          stageListenerRuleArn: <DEV_STAGE_LISTENER_RULE_ARN>
        - stage:
            identifier: Staging
            template:
              templateInputs:
                type: Deployment
                spec:
                  environment:
                    environmentRef: staging
                    infrastructureDefinitions:
                    - identifier: staging_ecs
                  execution:
                    steps:
                    - step:
                        identifier: BlueGreen_Create
                        type: EcsBlueGreenCreateService
                        spec:
                          loadBalancer: <STAGING_LOAD_BALANCER_ARN>
                          prodListener: <STAGING_PROD_LISTENER_ARN>
                          prodListenerRuleArn: <STAGING_PROD_LISTENER_RULE_ARN>
                          stageListener: <STAGING_STAGE_LISTENER_ARN>
                          stageListenerRuleArn: <STAGING_STAGE_LISTENER_RULE_ARN>
        - stage:
            identifier: Prod
            template:
              templateInputs:
                type: Deployment
                spec:
                  environment:
                    environmentRef: prod
                    infrastructureDefinitions:
                    - identifier: prod_ecs
                  execution:
                    steps:
                    - step:
                        identifier: BlueGreen_Create
                        type: EcsBlueGreenCreateService
                        spec:
                          loadBalancer: <PROD_LOAD_BALANCER_ARN>
                          prodListener: <PROD_PROD_LISTENER_ARN>
                          prodListenerRuleArn: <PROD_PROD_LISTENER_RULE_ARN>
                          stageListener: <PROD_STAGE_LISTENER_ARN>
                          stageListenerRuleArn: <PROD_STAGE_LISTENER_RULE_ARN>

template:
  name: ECS Stage Insert Delivery
  identifier: ecs_stage_insert_delivery
  versionLabel: 0.1.0
  type: Pipeline
  orgIdentifier: template_factory
  projectIdentifier: Experian_Demo_Templates
  description: Platform lifecycle with deployment slots. Requires insert-aware OPA and Harness validation of slot status expressions
    before adoption.
  tags:
    owner: platform
    status: candidate
  spec:
    allowStageExecutions: false
    stages:
    - insert:
        name: Dev
        identifier: Dev
        stages: <+input>
    - insert:
        name: Staging
        identifier: Staging
        stages: <+input>
    - stage:
        name: Production approval
        identifier: Approve_Prod
        type: Approval
        spec:
          execution:
            steps:
            - step:
                name: Require successful lower environments
                identifier: Check_Lower_Environments
                template:
                  templateRef: ecs_require_success
                  versionLabel: 0.1.0
                  templateInputs:
                    type: ShellScript
                    spec:
                      environmentVariables:
                      - name: REQUIRED_STATUSES
                        type: String
                        value: <+pipeline.stages.Dev.status> <+pipeline.stages.Staging.status>
                      - name: EXPECTED_COUNT
                        type: String
                        value: '2'
            - step:
                name: Approve production deployment
                identifier: Production_Approval
                type: HarnessApproval
                timeout: 1d
                spec:
                  approvalMessage: Approve the release validated in Dev and Staging. Review the service, immutable artifact,
                    target and deployment strategy.
                  includePipelineExecutionHistory: true
                  approvers:
                    minimumCount: 1
                    disallowPipelineExecutor: true
                    userGroups:
                    - account.developer_leads
                    - account.platform_team
                  isAutoRejectEnabled: false
                  approverInputs: []
        when:
          pipelineStatus: All
        failureStrategies:
        - onFailure:
            errors:
            - AllErrors
            action:
              type: Abort
    - insert:
        name: Prod
        identifier: Prod
        stages: <+input>
    - stage:
        name: Release result
        identifier: Complete_Release
        type: Custom
        spec:
          execution:
            steps:
            - step:
                name: Require successful release
                identifier: Check_Release_Result
                template:
                  templateRef: ecs_require_success
                  versionLabel: 0.1.0
                  templateInputs:
                    type: ShellScript
                    spec:
                      environmentVariables:
                      - name: REQUIRED_STATUSES
                        type: String
                        value: <+pipeline.stages.Dev.status> <+pipeline.stages.Staging.status> <+pipeline.stages.Approve_Prod.status>
                          <+pipeline.stages.Approve_Prod.spec.execution.steps.Production_Approval.status> <+pipeline.stages.Prod.status>
                      - name: EXPECTED_COUNT
                        type: String
                        value: '5'
        when:
          pipelineStatus: All
        failureStrategies:
        - onFailure:
            errors:
            - AllErrors
            action:
              type: MarkAsFailure

template:
  name: ECS Blue Green Stage
  identifier: ecs_blue_green_stage
  versionLabel: 0.1.0
  type: Stage
  description: native ECS deployment, Continuous Verification and rollback.
  spec:
    type: Deployment
    spec:
      deploymentType: ECS
      environment:
        environmentRef: <+input>
        deployToAll: false
        environmentInputs: <+input>
        serviceOverrideInputs: <+input>
        infrastructureDefinitions: <+input>
      service:
        serviceRef: <+input>
        serviceInputs: <+input>
      execution:
        steps:
        - step:
            name: ECS Blue Green Create Service
            identifier: BlueGreen_Create
            type: EcsBlueGreenCreateService
            timeout: 15m
            spec:
              loadBalancer: <+serviceVariables.loadBalancer>
              prodListener: <+serviceVariables.prodListenerArn>
              prodListenerRuleArn: <+serviceVariables.prodListenerRuleArn>
              stageListener: <+serviceVariables.stageListenerArn>
              stageListenerRuleArn: <+serviceVariables.stageListenerRuleArn>
              isTrafficShift: false
              sameAsAlreadyRunningInstances: false
        - step:
            name: Verify Bluegreen
            identifier: Verify_Bluegreen
            type: Verify
            timeout: 2h
            spec:
              isMultiServicesOrEnvs: false
              type: Bluegreen
              monitoredService:
                type: Default
                spec: {}
              spec:
                sensitivity: HIGH
                duration: 15m
        - step:
            name: Swap Blue Green target groups
            identifier: BlueGreen_Swap
            type: EcsBlueGreenSwapTargetGroups
            timeout: 10m
            spec:
              doNotDownsizeOldService: false
        rollbackSteps:
        - step:
            name: ECS Blue Green Rollback
            identifier: BlueGreen_Rollback
            type: EcsBlueGreenRollback
            timeout: 15m
            spec: {}
            when:
              stageStatus: All
    failureStrategies:
    - onFailure:
        errors:
        - AllErrors
        action:
          type: StageRollback
    when:
      pipelineStatus: Success

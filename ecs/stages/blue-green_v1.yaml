template:
  name: ECS Blue Green Stage
  identifier: ecs_blue_green_stage
  versionLabel: 0.1.0
  type: Stage
  orgIdentifier: template_factory
  projectIdentifier: Experian_Demo_Templates
  description: Native ECS Blue Green deployment, platform verification and rollback; developer test inserts are unpopulated.
  tags:
    owner: platform
    status: candidate
  spec:
    type: Deployment
    spec:
      deploymentType: ECS
      environment:
        environmentRef: <+input>
        deployToAll: false
        environmentInputs: <+input>
        serviceOverrideInputs: <+input>
        infrastructureDefinitions: <+input>
      service:
        serviceRef: <+input>
        serviceInputs: <+input>
      execution:
        steps:
        - step:
            name: ECS Blue Green Create Service
            identifier: BlueGreen_Create
            type: EcsBlueGreenCreateService
            timeout: 15m
            spec:
              loadBalancer: <+serviceVariables.loadBalancer>
              prodListener: <+serviceVariables.prodListenerArn>
              prodListenerRuleArn: <+serviceVariables.prodListenerRuleArn>
              stageListener: <+serviceVariables.candidateListenerArn>
              stageListenerRuleArn: <+serviceVariables.candidateListenerRuleArn>
              isTrafficShift: false
              sameAsAlreadyRunningInstances: false
        - insert:
            name: Developer application validation
            identifier: Application_Validation
            steps: <+input>
        - step:
            name: Verify Bluegreen
            identifier: Verify_BlueGreen
            type: Verify
            timeout: 2h
            spec:
              isMultiServicesOrEnvs: false
              type: Bluegreen
              monitoredService:
                type: Default
                spec: {}
              spec:
                sensitivity: HIGH
                duration: 15m
        - step:
            name: Require successful verification
            identifier: Check_Verification
            template:
              templateRef: ecs_require_success
              versionLabel: 0.1.0
              templateInputs:
                type: ShellScript
                spec:
                  environmentVariables:
                  - name: REQUIRED_STATUSES
                    type: String
                    value: <+stage.spec.execution.steps.Verify_BlueGreen.status>
                  - name: EXPECTED_COUNT
                    type: String
                    value: '1'
        - step:
            name: Swap Blue Green target groups
            identifier: BlueGreen_Swap
            type: EcsBlueGreenSwapTargetGroups
            timeout: 10m
            spec:
              doNotDownsizeOldService: true
        - insert:
            name: Developer live validation
            identifier: Live_Validation
            steps: <+input>
        rollbackSteps:
        - step:
            name: ECS Blue Green Rollback
            identifier: BlueGreen_Rollback
            type: EcsBlueGreenRollback
            timeout: 15m
            spec: {}
            when:
              stageStatus: All
    failureStrategies:
    - onFailure:
        errors:
        - AllErrors
        action:
          type: StageRollback
    when:
      pipelineStatus: Success

template:
  name: ECS Canary Stage
  identifier: ecs_canary_stage
  versionLabel: 0.1.0
  type: Stage
  description: native ECS deployment, Continuous Verification and rollback.
  spec:
    type: Deployment
    spec:
      deploymentType: ECS
      environment:
        environmentRef: <+input>
        deployToAll: false
        environmentInputs: <+input>
        serviceOverrideInputs: <+input>
        infrastructureDefinitions: <+input>
      service:
        serviceRef: <+input>
        serviceInputs: <+input>
      execution:
        steps:
        - step:
            name: ECS Canary Deploy
            identifier: Canary_Deploy
            type: EcsCanaryDeploy
            timeout: 15m
            spec: {}
        - step:
            name: Verify Canary
            identifier: Verify_Canary
            type: Verify
            timeout: 2h
            spec:
              isMultiServicesOrEnvs: false
              type: Canary
              monitoredService:
                type: Default
                spec: {}
              spec:
                sensitivity: HIGH
                duration: 15m
        - insert:
            name: Developer Functional Test
            identifier: Developer_Functional_Test
            steps: <+input>
        - step:
            name: Delete canary
            identifier: Canary_Delete
            type: EcsCanaryDelete
            timeout: 10m
            spec: {}
        - step:
            name: Promote canary with rolling deploy
            identifier: Canary_Rolling_Deploy
            type: EcsRollingDeploy
            timeout: 15m
            spec:
              sameAsAlreadyRunningInstances: false
              forceNewDeployment: false
        rollbackSteps:
        - step:
            name: ECS Rolling Rollback
            identifier: Rolling_Rollback
            type: EcsRollingRollback
            timeout: 15m
            spec: {}
            when:
              stageStatus: All
              condition: (<+stage.spec.execution.steps.Canary_Rolling_Deploy.status> == "SUCCEEDED" || <+stage.spec.execution.steps.Canary_Rolling_Deploy.status>
                == "FAILED" || <+stage.spec.execution.steps.Canary_Rolling_Deploy.status> == "ABORTED" || <+stage.spec.execution.steps.Canary_Rolling_Deploy.status>
                == "EXPIRED" || <+stage.spec.execution.steps.Canary_Rolling_Deploy.status> == "ERRORED")
        - step:
            name: Clean up failed canary
            identifier: Canary_Rollback_Delete
            type: EcsCanaryDelete
            timeout: 10m
            spec: {}
            when:
              stageStatus: All
              condition: <+stage.spec.execution.steps.Canary_Delete.status> != "SUCCEEDED"
    failureStrategies:
    - onFailure:
        errors:
        - AllErrors
        action:
          type: StageRollback
    when:
      pipelineStatus: Success

template:
  name: ECS Rolling Stage
  identifier: ecs_rolling_stage
  versionLabel: 0.1.0
  type: Stage
  orgIdentifier: template_factory
  projectIdentifier: Experian_Demo_Templates
  description: Native ECS Rolling deployment, platform verification and rollback; developer test inserts are unpopulated.
  tags:
    owner: platform
    status: candidate
  spec:
    type: Deployment
    spec:
      deploymentType: ECS
      environment:
        environmentRef: <+input>
        deployToAll: false
        environmentInputs: <+input>
        serviceOverrideInputs: <+input>
        infrastructureDefinitions: <+input>
      service:
        serviceRef: <+input>
        serviceInputs: <+input>
      execution:
        steps:
        - step:
            name: ECS Rolling Deploy
            identifier: Rolling_Deploy
            type: EcsRollingDeploy
            timeout: 15m
            spec:
              sameAsAlreadyRunningInstances: false
              forceNewDeployment: false
        - insert:
            name: Developer application validation
            identifier: Application_Validation
            steps: <+input>
        - step:
            name: Verify Rolling
            identifier: Verify_Rolling
            type: Verify
            timeout: 2h
            spec:
              isMultiServicesOrEnvs: false
              type: Rolling
              monitoredService:
                type: Default
                spec: {}
              spec:
                sensitivity: HIGH
                duration: 15m
        - step:
            name: Require successful verification
            identifier: Check_Verification
            template:
              templateRef: ecs_require_success
              versionLabel: 0.1.0
              templateInputs:
                type: ShellScript
                spec:
                  environmentVariables:
                  - name: REQUIRED_STATUSES
                    type: String
                    value: <+stage.spec.execution.steps.Verify_Rolling.status>
                  - name: EXPECTED_COUNT
                    type: String
                    value: '1'
        - insert:
            name: Developer live validation
            identifier: Live_Validation
            steps: <+input>
        rollbackSteps:
        - step:
            name: ECS Rolling Rollback
            identifier: Rolling_Rollback
            type: EcsRollingRollback
            timeout: 15m
            spec: {}
            when:
              stageStatus: All
    failureStrategies:
    - onFailure:
        errors:
        - AllErrors
        action:
          type: StageRollback
    when:
      pipelineStatus: Success

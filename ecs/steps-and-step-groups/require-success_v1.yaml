template:
  name: ECS Require Success
  identifier: ecs_require_success
  versionLabel: 0.1.0
  type: Step
  orgIdentifier: template_factory
  projectIdentifier: Experian_Demo_Templates
  description: Platform lifecycle guard. Reject missing, skipped, ignored, failed or unresolved required statuses.
  tags:
    owner: platform
    status: candidate
  spec:
    type: ShellScript
    timeout: 1m
    spec:
      shell: Bash
      executionTarget: {}
      source:
        type: Inline
        spec:
          script: |
            set -euo pipefail
            if [[ ! "$EXPECTED_COUNT" =~ ^[1-9][0-9]*$ ]] || [[ "$REQUIRED_STATUSES" == *$'\n'* ]]; then
              printf '%s\n' 'Invalid lifecycle status inputs.' >&2
              exit 1
            fi
            read -r -a statuses <<< "$REQUIRED_STATUSES"
            if [[ "${#statuses[@]}" -ne "$EXPECTED_COUNT" ]]; then
              printf '%s\n' 'A required lifecycle status is missing.' >&2
              exit 1
            fi
            for status in "${statuses[@]}"; do
              if [[ "$status" != 'SUCCEEDED' ]]; then
                printf '%s\n' 'A required stage or approval did not succeed; release cannot continue.' >&2
                exit 1
              fi
            done
      environmentVariables:
      - name: REQUIRED_STATUSES
        type: String
        value: <+input>
      - name: EXPECTED_COUNT
        type: String
        value: <+input>
      outputVariables: []

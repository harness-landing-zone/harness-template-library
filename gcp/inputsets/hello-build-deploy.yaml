inputSet:
  name: Hello Cloud Run - build and push
  identifier: hello_build_deploy
  orgIdentifier: bau_payments
  projectIdentifier: GCP_Project
  pipeline:
    identifier: gcp_gar_build_scan_push
    properties:
      ci:
        codebase:
          connectorRef: account.generic
          repoName: harness-template-library
          build:
            type: branch
            spec:
              branch: main
    variables:
    - name: gar_project
      type: String
      value: harness-management
    - name: gar_region
      type: String
      value: europe-west2
    - name: gar_repository
      type: String
      value: gcp-test-image
    - name: image_name
      type: String
      value: hello-cloud-run
    - name: gcp_connector
      type: String
      value: gcpproject
    - name: dockerfile
      type: String
      value: gcp/cr-service/Dockerfile
    - name: build_context
      type: String
      value: gcp/cr-service
    stages:
    - stage:
        identifier: Build_Scan_Push
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
            - step:
                identifier: Unit_Tests
                type: Test
                spec:
                  connectorRef: account.DockerHub
                  image: maven:3.9-eclipse-temurin-21
                  command: mvn -B -f gcp/cr-service/pom.xml test
                  globs:
                  - gcp/cr-service/src/test/java/**/*Test.java
                  reports:
                  - gcp/cr-service/target/surefire-reports/TEST-*.xml
            - step:
                identifier: Build_Image
                type: BuildAndPushGAR
                spec:
                  baseImageConnectorRefs:
                  - account.DockerHub

inputSet:
  name: Hello Cloud Run - build and push
  identifier: hello_build_deploy
  orgIdentifier: bau_payments
  projectIdentifier: GCP_Project
  pipeline:
    identifier: gcp_gar_build_scan_push
    properties:
      ci:
        codebase:
          connectorRef: account.generic
          repoName: harness-template-library
          build:
            type: branch
            spec:
              branch: main
    variables:
    - name: gar_project
      type: String
      value: harness-management
    - name: gar_region
      type: String
      value: europe-west2
    - name: gar_repository
      type: String
      value: gcp-test-image
    - name: image_name
      type: String
      value: hello-cloud-run
    - name: gcp_connector
      type: String
      value: gcpproject
    - name: dockerfile
      type: String
      value: gcp/cr-service/Dockerfile
    - name: build_context
      type: String
      value: gcp/cr-service
    stages:
    - stage:
        identifier: Build_Scan_Push
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
            - step:
                identifier: Smoke_Tests
                type: Run
                spec:
                  connectorRef: account.DockerHub
                  command: |
                    set -eu
                    python3 - <<'PYTEST'
                    from functools import partial
                    from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
                    from threading import Thread
                    from urllib.request import urlopen
                    from urllib.error import HTTPError

                    server = ThreadingHTTPServer(("127.0.0.1", 0), partial(SimpleHTTPRequestHandler, directory="gcp/cr-service"))
                    worker = Thread(target=server.serve_forever, daemon=True)
                    worker.start()
                    base = "http://127.0.0.1:" + str(server.server_port)
                    try:
                        with urlopen(base + "/", timeout=5) as response:
                            assert response.status == 200
                            assert "Hello from Cloud Run" in response.read().decode()
                        print("PASS: homepage returns 200 and expected content")
                        try:
                            urlopen(base + "/missing-test-page", timeout=5)
                        except HTTPError as error:
                            assert error.code == 404
                        else:
                            raise AssertionError("Missing page should return 404")
                        print("PASS: missing page returns 404")
                    finally:
                        server.shutdown()
                        server.server_close()
                        worker.join()
                    PYTEST
            - step:
                identifier: Build_Image
                type: BuildAndPushGAR
                spec:
                  baseImageConnectorRefs:
                  - account.DockerHub

inputSet:
  name: Hello Cloud Run - redeploy existing image
  identifier: hello_deploy
  orgIdentifier: bau_payments
  projectIdentifier: GCP_Project
  pipeline:
    identifier: gcp_cloud_run_deploy
    variables:
    - name: gar_project
      type: String
      value: harness-management
    - name: gar_region
      type: String
      value: europe-west2
    - name: gar_repository
      type: String
      value: gcp-test-image
    - name: image_name
      type: String
      value: hello-cloud-run
    - name: gcp_connector
      type: String
      value: gcpproject
    - name: docker_connector
      type: String
      value: account.DockerHub
    - name: service_ref
      type: String
      value: cloud_run_test
    - name: environment_ref
      type: String
      value: staging
    - name: infrastructure_ref
      type: String
      value: cloud_run_test
    - name: execution_connector
      type: String
      value: account.Shared_Cluster
    - name: execution_namespace
      type: String
      value: default
    - name: image_tag
      type: String
      value: <+input>
    - name: image_digest
      type: String
      value: <+input>
    - name: manifest_connector
      type: String
      value: account.generic
    - name: manifest_repo
      type: String
      value: harness-template-library
    - name: manifest_path
      type: String
      value: gcp/cr-service/service.yaml
    - name: source_commit
      type: String
      value: <+input>

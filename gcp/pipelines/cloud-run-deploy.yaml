pipeline:
  name: GCP Cloud Run Deploy
  identifier: gcp_cloud_run_deploy
  orgIdentifier: bau_payments
  projectIdentifier: GCP_Project
  description: Deploy a GAR image by tag and digest using a Cloud Run Harness service and infrastructure supplied by an input set. Native rollback
    on failure.
  tags: {}
  variables:
  - name: gar_project
    type: String
    value: <+input>
  - name: gar_region
    type: String
    value: <+input>
  - name: gar_repository
    type: String
    value: <+input>
  - name: image_name
    type: String
    value: <+input>
  - name: gcp_connector
    type: String
    value: <+input>
  - name: docker_connector
    type: String
    value: <+input>
  - name: service_ref
    type: String
    value: <+input>
  - name: environment_ref
    type: String
    value: <+input>
  - name: infrastructure_ref
    type: String
    value: <+input>
  - name: execution_connector
    type: String
    value: <+input>
  - name: execution_namespace
    type: String
    value: <+input>
  - name: image_tag
    type: String
    value: <+input>
  - name: image_digest
    type: String
    value: <+input>
  - name: manifest_connector
    type: String
    value: <+input>
  - name: manifest_repo
    type: String
    value: <+input>
  - name: manifest_path
    type: String
    value: <+input>
  - name: source_commit
    type: String
    value: <+input>
  stages:
  - stage:
      name: Deploy Cloud Run
      identifier: Deploy_Staging
      type: Deployment
      spec:
        deploymentType: GoogleCloudRun
        service:
          serviceRef: <+pipeline.variables.service_ref>
          serviceInputs:
            serviceDefinition:
              type: GoogleCloudRun
              spec:
                artifacts:
                  primary:
                    primaryArtifactRef: gar
                    sources:
                    - identifier: gar
                      type: GoogleArtifactRegistry
                      spec:
                        project: <+pipeline.variables.gar_project>
                        region: <+pipeline.variables.gar_region>
                        repositoryName: <+pipeline.variables.gar_repository>
                        version: <+pipeline.variables.image_tag>
                        digest: <+pipeline.variables.image_digest>
                        connectorRef: <+pipeline.variables.gcp_connector>
                        package: <+pipeline.variables.image_name>
                manifests:
                - manifest:
                    identifier: cloud_run
                    type: GoogleCloudRunService
                    spec:
                      store:
                        type: Github
                        spec:
                          connectorRef: <+pipeline.variables.manifest_connector>
                          repoName: <+pipeline.variables.manifest_repo>
                          commitId: <+pipeline.variables.source_commit>
                          paths:
                          - <+pipeline.variables.manifest_path>
        environment:
          environmentRef: <+pipeline.variables.environment_ref>
          deployToAll: false
          infrastructureDefinitions:
          - identifier: <+pipeline.variables.infrastructure_ref>
        execution:
          steps:
          - stepGroup:
              name: Deploy Cloud Run
              identifier: Deploy_Cloud_Run
              stepGroupInfra:
                type: KubernetesDirect
                spec:
                  connectorRef: <+pipeline.variables.execution_connector>
                  namespace: <+pipeline.variables.execution_namespace>
              steps:
              - step:
                  name: Download manifest
                  identifier: Download_Manifest
                  type: DownloadManifests
                  spec: {}
                  timeout: 10m
              - step:
                  name: Prepare rollback
                  identifier: Prepare_Rollback
                  type: GoogleCloudRunPrepareRollbackData
                  spec:
                    connectorRef: <+pipeline.variables.docker_connector>
                    image: harness/google-cloud-run-plugin:1.0.4-linux-amd64
                    imagePullPolicy: IfNotPresent
                  timeout: 10m
              - step:
                  name: Deploy Cloud Run service
                  identifier: Deploy_Service
                  type: GoogleCloudRunDeploy
                  spec:
                    connectorRef: <+pipeline.variables.docker_connector>
                    image: harness/google-cloud-run-plugin:1.0.4-linux-amd64
                    imagePullPolicy: IfNotPresent
                    skipTrafficShift: false
                  timeout: 15m
          rollbackSteps:
          - stepGroup:
              name: Roll back Cloud Run
              identifier: Rollback_Cloud_Run
              stepGroupInfra:
                type: KubernetesDirect
                spec:
                  connectorRef: <+pipeline.variables.execution_connector>
                  namespace: <+pipeline.variables.execution_namespace>
              steps:
              - step:
                  name: Restore previous traffic
                  identifier: Rollback_Service
                  type: GoogleCloudRunRollback
                  spec:
                    connectorRef: <+pipeline.variables.docker_connector>
                    image: harness/google-cloud-run-plugin:1.0.4-linux-amd64
                    imagePullPolicy: IfNotPresent
                  timeout: 15m
      failureStrategies:
      - onFailure:
          errors:
          - AllErrors
          action:
            type: StageRollback
  allowStageExecutions: false

pipeline:
  name: GCP GAR Build Scan Push
  identifier: gcp_gar_build_scan_push
  orgIdentifier: bau_payments
  projectIdentifier: GCP_Project
  description: Scan source with Gitleaks and Checkov, build an image, scan it with
    Trivy, and push the scanned archive to GAR. Configuration comes from an input
    set; CD is run separately.
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: <+input>
        repoName: <+input>
        build: <+input>
  variables:
  - name: gar_project
    type: String
    value: <+input>
  - name: gar_region
    type: String
    value: <+input>
  - name: gar_repository
    type: String
    value: <+input>
  - name: image_name
    type: String
    value: <+input>
  - name: gcp_connector
    type: String
    value: <+input>
  - name: dockerfile
    type: String
    value: <+input>
  - name: build_context
    type: String
    value: <+input>
  - name: image_tag
    type: String
    value: build-<+pipeline.sequenceId>
  stages:
  - stage:
      name: Build Scan Push
      identifier: Build_Scan_Push
      type: CI
      spec:
        cloneCodebase: <+input>
        platform:
          os: Linux
          arch: Amd64
        runtime:
          type: Cloud
          spec: {}
        execution:
          steps:
          - step:
              type: Gitleaks
              name: Scan source secrets
              identifier: Scan_Secrets
              spec:
                mode: orchestration
                config: default
                target:
                  type: repository
                  detection: auto
                  workspace: /harness
                advanced:
                  log:
                    level: info
                  fail_on_severity: none
                settings:
                  tool_args: --redact --log-opts="-n 1"
              timeout: 10m
          - step:
              type: Checkov
              name: Scan Dockerfile and IaC
              identifier: Scan_IaC
              spec:
                mode: orchestration
                config: default
                target:
                  type: repository
                  detection: auto
                  workspace: /harness/<+pipeline.variables.build_context>
                advanced:
                  log:
                    level: info
                  fail_on_severity: none
              timeout: 10m
          - step:
              type: Run
              name: Test sample web responses
              identifier: Smoke_Tests
              timeout: 5m
              spec:
                connectorRef: <+input>
                image: python:3.13-alpine
                shell: Sh
                command: <+input>
          - step:
              name: Build image without pushing
              identifier: Build_Image
              type: BuildAndPushGAR
              timeout: 20m
              spec:
                connectorRef: <+pipeline.variables.gcp_connector>
                host: <+pipeline.variables.gar_region>-docker.pkg.dev
                projectID: <+pipeline.variables.gar_project>
                imageName: <+pipeline.variables.gar_repository>/<+pipeline.variables.image_name>
                tags:
                - <+pipeline.variables.image_tag>
                dockerfile: <+pipeline.variables.dockerfile>
                context: <+pipeline.variables.build_context>
                baseImageConnectorRefs: <+input>
                caching: true
                envVariables:
                  PLUGIN_NO_PUSH: 'true'
                  PLUGIN_BUILDX_LOAD: 'true'
                  PLUGIN_TAR_PATH: /harness/image.tar
          - step:
              name: Scan image with Trivy
              identifier: Scan_Image
              type: AquaTrivy
              timeout: 20m
              spec:
                mode: orchestration
                config: default
                target:
                  type: container
                  detection: manual
                  name: <+pipeline.variables.gar_region>-docker.pkg.dev/<+pipeline.variables.gar_project>/<+pipeline.variables.gar_repository>/<+pipeline.variables.image_name>
                  variant: <+pipeline.variables.image_tag>
                  workspace: /harness/image.tar
                image:
                  type: local_archive
                advanced:
                  log:
                    level: info
                  fail_on_severity: none
          - step:
              name: Push scanned image to GAR
              identifier: Push_Image
              type: BuildAndPushGAR
              timeout: 10m
              spec:
                connectorRef: <+pipeline.variables.gcp_connector>
                host: <+pipeline.variables.gar_region>-docker.pkg.dev
                projectID: <+pipeline.variables.gar_project>
                imageName: <+pipeline.variables.gar_repository>/<+pipeline.variables.image_name>
                tags:
                - <+pipeline.variables.image_tag>
                caching: true
                envVariables:
                  PLUGIN_PUSH_ONLY: 'true'
                  PLUGIN_SOURCE_TAR_PATH: /harness/image.tar
                dockerfile: <+pipeline.variables.dockerfile>
                context: <+pipeline.variables.build_context>
      failureStrategies:
      - onFailure:
          errors:
          - AllErrors
          action:
            type: Abort
  allowStageExecutions: false

service:
  name: harness-cloudrun-test
  identifier: cloud_run_test
  orgIdentifier: bau_payments
  projectIdentifier: GCP_Project
  serviceDefinition:
    type: GoogleCloudRun
    spec:
      artifacts:
        primary:
          primaryArtifactRef: gar
          sources:
          - identifier: gar
            type: GoogleArtifactRegistry
            spec:
              connectorRef: <+input>
              repositoryType: docker
              project: <+input>
              region: <+input>
              repositoryName: <+input>
              package: <+input>
              version: <+input>
              digest: <+input>
      manifests:
      - manifest:
          identifier: cloud_run
          type: GoogleCloudRunService
          spec:
            store:
              type: Inline
              spec:
                content: |
                  apiVersion: serving.knative.dev/v1
                  kind: Service
                  metadata:
                    name: <+service.name>
                    annotations:
                      run.googleapis.com/ingress: all
                      run.googleapis.com/minScale: '0'
                      run.googleapis.com/maxScale: '1'
                  spec:
                    template:
                      metadata:
                        annotations:
                          run.googleapis.com/cpu-throttling: 'true'
                          run.googleapis.com/startup-cpu-boost: 'false'
                      spec:
                        containerConcurrency: 10
                        timeoutSeconds: 30
                        containers:
                        - name: app
                          image: <+artifact.image>
                          ports:
                          - name: http1
                            containerPort: 8080
                          resources:
                            limits:
                              cpu: '1'
                              memory: 512Mi
                    traffic:
                    - latestRevision: true
                      percent: 100

service:
  name: harness-cloudrun-test
  identifier: cloud_run_test
  orgIdentifier: bau_payments
  projectIdentifier: GCP_Project
  serviceDefinition:
    type: GoogleCloudRun
    spec:
      artifacts:
        primary:
          primaryArtifactRef: gar
          sources:
          - identifier: gar
            type: GoogleArtifactRegistry
            spec:
              connectorRef: <+input>
              repositoryType: docker
              project: <+input>
              region: <+input>
              repositoryName: <+input>
              package: <+input>
              version: <+input>
              digest: <+input>
      manifests:
      - manifest:
          identifier: cloud_run
          type: GoogleCloudRunService
          spec:
            store:
              type: Github
              spec:
                connectorRef: <+input>
                repoName: <+input>
                gitFetchType: Commit
                commitId: <+input>
                paths: <+input>

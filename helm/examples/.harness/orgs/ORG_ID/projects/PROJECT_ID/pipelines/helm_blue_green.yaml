# Consumer pipeline stored in the application repo. Its shape belongs to the template;
# developers change deployment targets through input_sets/, not this file.
pipeline:
  name: My Helm Service - Blue Green
  identifier: helm_blue_green
  orgIdentifier: ORG_ID
  projectIdentifier: PROJECT_ID
  template:
    templateRef: account.helm_blue_green_delivery
    versionLabel: 0.1.0
    templateInputs:
      stages:
      - stage:
          identifier: Dev
          template:
            templateInputs:
              type: Deployment
              spec:
                service:
                  serviceRef: <+input>
                  serviceInputs: <+input>
                environment:
                  environmentRef: <+input>
                  environmentInputs: <+input>
                  serviceOverrideInputs: <+input>
                  infrastructureDefinitions: <+input>
                execution:
                  steps:
                  - insert:
                      identifier: Developer_Functional_Test
                      steps:
                      - step:
                          name: Candidate health check
                          identifier: Candidate_Health_Check
                          type: Http
                          timeout: 2m
                          spec:
                            url: <+serviceVariables.candidateHealthUrl>
                            method: GET
                            headers: []
                            assertion: <+httpResponseCode> == 200
                            outputVariables: []
      - stage:
          identifier: Staging
          template:
            templateInputs:
              type: Deployment
              spec:
                environment:
                  environmentRef: <+input>
                  environmentInputs: <+input>
                  serviceOverrideInputs: <+input>
                  infrastructureDefinitions: <+input>
                execution:
                  steps:
                  - insert:
                      identifier: Developer_Functional_Test
                      steps:
                      - step:
                          name: Candidate health check
                          identifier: Candidate_Health_Check
                          type: Http
                          timeout: 2m
                          spec:
                            url: <+serviceVariables.candidateHealthUrl>
                            method: GET
                            headers: []
                            assertion: <+httpResponseCode> == 200
                            outputVariables: []
      - stage:
          identifier: Prod
          template:
            templateInputs:
              type: Deployment
              spec:
                environment:
                  environmentRef: <+input>
                  environmentInputs: <+input>
                  serviceOverrideInputs: <+input>
                  infrastructureDefinitions: <+input>
                execution:
                  steps:
                  - insert:
                      identifier: Developer_Functional_Test
                      steps:
                      - step:
                          name: Candidate health check
                          identifier: Candidate_Health_Check
                          type: Http
                          timeout: 2m
                          spec:
                            url: <+serviceVariables.candidateHealthUrl>
                            method: GET
                            headers: []
                            assertion: <+httpResponseCode> == 200
                            outputVariables: []

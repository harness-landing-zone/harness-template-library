template:
  name: Helm Variable Strategy Stage
  identifier: helm_variable_strategy_stage
  versionLabel: 0.1.0
  type: Stage
  description: Helm chart deployed by Harness with Rolling, Canary or Blue Green chosen by variable, Continuous Verification and rollback.
  spec:
    type: Deployment
    spec:
      deploymentType: Kubernetes
      environment:
        environmentRef: <+input>
        deployToAll: false
        environmentInputs: <+input>
        serviceOverrideInputs: <+input>
        infrastructureDefinitions: <+input>
      service:
        serviceRef: <+input>
        serviceInputs: <+input>
      execution:
        steps:
        - step:
            name: Rolling Deployment
            identifier: Rolling_Deploy
            type: K8sRollingDeploy
            timeout: 15m
            spec:
              skipDryRun: false
              pruningEnabled: false
            when:
              stageStatus: Success
              condition: <+stage.variables.deploymentStrategy> == "rolling"
        - step:
            name: Canary Deployment
            identifier: Canary_Deploy
            type: K8sCanaryDeploy
            timeout: 15m
            spec:
              instanceSelection:
                type: Count
                spec:
                  count: 1
              skipDryRun: false
            when:
              stageStatus: Success
              condition: <+stage.variables.deploymentStrategy> == "canary"
        - step:
            name: Stage Deployment
            identifier: BlueGreen_Deploy
            type: K8sBlueGreenDeploy
            timeout: 15m
            spec:
              skipDryRun: false
              pruningEnabled: false
              skipDeploymentIfSameManifest: false
            when:
              stageStatus: Success
              condition: <+stage.variables.deploymentStrategy> == "blue-green"
        - step:
            name: Verify Rolling
            identifier: Verify_Rolling
            type: Verify
            timeout: 2h
            spec:
              isMultiServicesOrEnvs: false
              type: Rolling
              monitoredService:
                type: Default
                spec: {}
              spec:
                sensitivity: HIGH
                duration: 15m
            when:
              stageStatus: Success
              condition: <+stage.variables.deploymentStrategy> == "rolling"
        - step:
            name: Verify Canary
            identifier: Verify_Canary
            type: Verify
            timeout: 2h
            spec:
              isMultiServicesOrEnvs: false
              type: Canary
              monitoredService:
                type: Default
                spec: {}
              spec:
                sensitivity: HIGH
                duration: 15m
            when:
              stageStatus: Success
              condition: <+stage.variables.deploymentStrategy> == "canary"
        - step:
            name: Verify Bluegreen
            identifier: Verify_BlueGreen
            type: Verify
            timeout: 2h
            spec:
              isMultiServicesOrEnvs: false
              type: Bluegreen
              monitoredService:
                type: Default
                spec: {}
              spec:
                sensitivity: HIGH
                duration: 15m
            when:
              stageStatus: Success
              condition: <+stage.variables.deploymentStrategy> == "blue-green"
        - insert:
            name: Developer Functional Test
            identifier: Developer_Functional_Test
            steps: <+input>
        - step:
            name: Canary Delete
            identifier: Canary_Delete
            type: K8sCanaryDelete
            timeout: 10m
            spec: {}
            when:
              stageStatus: Success
              condition: <+stage.variables.deploymentStrategy> == "canary"
        - step:
            name: Primary Rolling Deployment
            identifier: Canary_Rolling_Deploy
            type: K8sRollingDeploy
            timeout: 15m
            spec:
              skipDryRun: false
              pruningEnabled: false
            when:
              stageStatus: Success
              condition: <+stage.variables.deploymentStrategy> == "canary"
        - step:
            name: Swap primary with stage service
            identifier: BlueGreen_Swap
            type: K8sBGSwapServices
            timeout: 10m
            spec: {}
            when:
              stageStatus: Success
              condition: <+stage.variables.deploymentStrategy> == "blue-green"
        rollbackSteps:
        - step:
            name: Canary Delete
            identifier: Canary_Rollback_Delete
            type: K8sCanaryDelete
            timeout: 10m
            spec: {}
            when:
              stageStatus: All
              condition: <+stage.variables.deploymentStrategy> == "canary"
        - step:
            name: Rolling Rollback
            identifier: Rolling_Rollback
            type: K8sRollingRollback
            timeout: 15m
            spec:
              pruningEnabled: false
            when:
              stageStatus: All
              condition: <+stage.variables.deploymentStrategy> == "rolling" || (<+stage.variables.deploymentStrategy>
                == "canary" && (<+stage.spec.execution.steps.Canary_Rolling_Deploy.status> == "SUCCEEDED" || <+stage.spec.execution.steps.Canary_Rolling_Deploy.status>
                == "FAILED" || <+stage.spec.execution.steps.Canary_Rolling_Deploy.status> == "ABORTED" || <+stage.spec.execution.steps.Canary_Rolling_Deploy.status>
                == "EXPIRED" || <+stage.spec.execution.steps.Canary_Rolling_Deploy.status> == "ERRORED"))
        - step:
            name: Swap primary with stage service
            identifier: BlueGreen_Rollback_Swap
            type: K8sBGSwapServices
            timeout: 10m
            spec: {}
            when:
              stageStatus: All
              condition: <+stage.variables.deploymentStrategy> == "blue-green" && (<+stage.spec.execution.steps.BlueGreen_Swap.status>
                == "SUCCEEDED" || <+stage.spec.execution.steps.BlueGreen_Swap.status> == "FAILED" || <+stage.spec.execution.steps.BlueGreen_Swap.status>
                == "ABORTED" || <+stage.spec.execution.steps.BlueGreen_Swap.status> == "EXPIRED" || <+stage.spec.execution.steps.BlueGreen_Swap.status> == "ERRORED")
    variables:
    - name: deploymentStrategy
      type: String
      description: Select a strategy the chart supports (Blue Green needs a Kubernetes Service in the chart).
      required: true
      value: <+input>.default(rolling).allowedValues(rolling,canary,blue-green)
    failureStrategies:
    - onFailure:
        errors:
        - AllErrors
        action:
          type: StageRollback
    when:
      pipelineStatus: Success
